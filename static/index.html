<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apertus Sovereign Operations Bridge</title><style>body{font-family:system-ui,sans-serif;max-width:980px;margin:40px auto;padding:0 18px;background:#fafafa;color:#161616}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:22px;margin:16px 0}.row{display:flex;gap:10px;flex-wrap:wrap}button{padding:10px 14px;border:1px solid #bbb;border-radius:9px;background:#fff;cursor:pointer}pre{white-space:pre-wrap;background:#111;color:#eee;padding:18px;border-radius:10px}.status{font-size:28px;font-weight:700}</style></head><body><h1>Apertus Sovereign Operations Bridge</h1><p>From AI answer to controlled, verified work.</p><div class="card"><div class="row"><button onclick="run('normal')">Normal</button><button onclick="run('missing')">Missing fact</button><button onclick="run('conflict')">Source conflict</button><button onclick="run('untrusted')">Untrusted instruction</button><button onclick="run('human_gate')">Human gate</button></div><div id="status" class="status">Ready</div><p id="reason">Choose a scenario.</p></div><div class="card"><pre id="output">{}</pre></div><script>async function run(s){document.getElementById('status').textContent='Running...';const r=await fetch('/api/run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({scenario:s})});const d=await r.json();document.getElementById('status').textContent=d.status||'ERROR';document.getElementById('reason').textContent=((d.control&&d.control.reasons)||[]).join(' ');document.getElementById('output').textContent=JSON.stringify(d,null,2)}</script></body></html>
